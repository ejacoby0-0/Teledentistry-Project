version: '3.8'

services:
  postgres-dev:
    image: postgres:16
    container_name: smile-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: smile_dev
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pocketbase:
    image: pocketbase/pocketbase:latest
    container_name: teledentistry-pocketbase
    ports:
      - "8090:8090"
    volumes:
      - ./pb_data:/pb_data
    restart: unless-stopped

volumes:
  postgres_data:
