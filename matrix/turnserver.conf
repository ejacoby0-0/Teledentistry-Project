# Coturn TURN/STUN configuration for Teledentistry Matrix WebRTC Calls
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0

# Shared secret with Matrix Synapse
use-auth-secret
static-auth-secret=teledentistry_turn_shared_secret_2026
realm=localhost

# Security & limits
no-stdout-log
log-file=/var/tmp/turn.log
no-loopback-peers
no-multicast-peers

min-port=49152
max-port=49160

# No TLS certs in dev
no-tls
no-dtls

# Relay-to-relay traffic between two allocations stays inside the container
# (relay addr = container IP), so do not add denied-peer-ip for private ranges.
# On a real LAN/WAN set external-ip=<public ip>/<container ip> and publish the min..max UDP range.

